name: security
on: [push, pull_request]

# Least privilege: the GITHUB_TOKEN can only read repo contents.
permissions:
  contents: read

jobs:
  # GATE: fails the build if a secret is found
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0            # gitleaks scans full git history
          persist-credentials: false
      - name: Install Gitleaks v8.30.1 (checksum verified)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Run Gitleaks
        run: ./gitleaks detect --source . --exit-code 1 --redact -v

  # REPORT: shows findings but does not block
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Run Semgrep
        run: |
          pip install semgrep==1.187.0
          semgrep scan --config auto      # no --error, so findings don't fail the build

  # REPORT: shows vulnerable dependencies but does not block
  deps:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Run Trivy
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" aquasec/trivy:0.76.2 \
            fs --scanners vuln --exit-code 0 /repo